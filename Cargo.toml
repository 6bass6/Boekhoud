[workspace]
resolver = "2"
members = ["crates/boekhoud-core", "crates/boekhoud-db", "crates/boekhoud-pdf", "crates/boekhoud-import", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
boekhoud-core = { path = "crates/boekhoud-core" }
boekhoud-db = { path = "crates/boekhoud-db" }
boekhoud-import = { path = "crates/boekhoud-import" }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
proptest = "1"
