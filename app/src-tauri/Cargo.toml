[package]
name = "boekhoud-app"
description = "Boekhoud desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "boekhoud_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
boekhoud-core.workspace = true
boekhoud-db.workspace = true
boekhoud-pdf = { path = "../../crates/boekhoud-pdf" }
boekhoud-import.workspace = true
base64 = "0.22"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Local OCR (Windows.Media.Ocr) and PDF rendering (Windows.Data.Pdf) for invoice proposals.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
