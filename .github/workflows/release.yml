name: Release

# Push a tag vX.Y.Z (matching the version in tauri.conf.json) to build the signed Windows installer and
# publish a GitHub Release with latest.json, which installed apps read to find updates.
# Release notes (Dutch, shown in the app) come from docs/releases/vX.Y.Z.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches app version and release notes exist
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"; exit 1
          fi
          notes="docs/releases/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || { echo "Missing $notes"; exit 1; }
          { echo "body<<EOF_NOTES"; cat "$notes"; echo; echo "EOF_NOTES"; } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run all tests
        run: cargo test --workspace
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Boekhoud ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
