name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux, core crates)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Frontend build (type-check)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo fmt --all -- --check
      # The Tauri shell needs WebKitGTK on Linux; it is linted and tested on Windows instead.
      - run: cargo clippy --workspace --exclude boekhoud-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude boekhoud-app

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Lint app crate
        run: cargo clippy -p boekhoud-app --all-targets -- -D warnings
      - name: Run all tests on Windows
        run: cargo test --workspace
      - name: Build installer
        working-directory: app
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: boekhoud-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
